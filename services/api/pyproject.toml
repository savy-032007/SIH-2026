[project]
name = "apaar-api"
version = "0.1.0"
description = "APAAR student data management and verification platform — API"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]
ignore = ["B008"]  # FastAPI Depends() in defaults is the documented idiom

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = ["error::DeprecationWarning:app.*"]
markers = [
  "slow: tests that generate or load the full synthetic dataset",
]
